<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 80,50 50,95 20,50' fill='%234caf50'/></svg>" />
    <title>텍스처 줄이기 비교</title>
    <style>
      :root {
        --bg: #f3ece2;
        --panel: #fffaf3;
        --ink: #2b2620;
        --muted: #7a6f62;
        --line: #e2d6c4;
        --accent: #3f8f4f;
        --worse: #b4533c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1d1a17;
          --panel: #26221e;
          --ink: #eee6da;
          --muted: #a89c8c;
          --line: #3b352e;
          --accent: #6cc07c;
          --worse: #e08a72;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, 'Malgun Gothic', sans-serif; }
      header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
      h1 { font-size: 17px; margin: 0 8px 0 0; }
      .group { display: flex; gap: 4px; align-items: center; }
      .group span { color: var(--muted); margin-right: 2px; }
      button, select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
      button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0; height: calc(100vh - 58px); }
      #view { position: relative; overflow: hidden; }
      #view canvas { display: block; width: 100%; height: 100%; }
      .label { position: absolute; top: 10px; padding: 3px 10px; border-radius: 999px; background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 13px; pointer-events: none; }
      #wipe { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3); cursor: ew-resize; }
      #wipe::after { content: '⇆'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; color: #333; border-radius: 999px; padding: 2px 6px; font-size: 12px; }
      #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
      #loading[hidden] { display: none; }
      tr.kept td { color: var(--muted); }
      table.tex { font-size: 12px; }
      table.tex td:first-child { word-break: break-all; }
      aside { overflow: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 14px 16px; }
      h2 { font-size: 14px; margin: 18px 0 8px; }
      h2:first-child { margin-top: 0; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      th, td { text-align: right; padding: 3px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
      th:first-child, td:first-child { text-align: left; white-space: normal; }
      th { color: var(--muted); font-weight: 500; }
      .down { color: var(--accent); }
      .same { color: var(--muted); }
      .note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
      .hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 12px; pointer-events: none; }
      @media (max-width: 800px) {
        main { grid-template-columns: 1fr; height: auto; }
        #view { height: 70vh; }
        aside { border-left: 0; border-top: 1px solid var(--line); }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>텍스처 줄이기 비교 · 하나 (여 · 어른)</h1>
      <div class="group" id="variant"><span>줄인 것</span></div>
      <div class="group" id="mode"><span>보기</span></div>
      <div class="group" id="shot"><span>카메라</span></div>
    </header>
    <main>
      <div id="view">
        <div id="loading">불러오는 중…</div>
        <div class="label" id="labelA" style="left: 10px">원본</div>
        <div class="label" id="labelB" style="right: 10px">줄인 것</div>
        <div id="wipe" hidden></div>
        <div class="hint">끌어서 돌리기 · 휠 확대 · 오른쪽 끌기 이동 (두 모델이 같은 카메라로 움직여요)</div>
      </div>
      <aside id="stats"></aside>
    </main>
    <script type="module" src="/src/ui/textureCompare.ts"></script>
  </body>
</html>
